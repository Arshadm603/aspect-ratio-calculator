<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TDEE Calculator - Daily Calorie Needs | SizeCalcHub</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f9;padding:20px}
.container{max-width:500px;background:white;margin:auto;padding:25px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
h1{text-align:center;color:#1e293b}
label{font-weight:bold;display:block;margin-top:12px}
input,select{width:100%;padding:10px;margin-top:5px;border:1px solid #cbd5e1;border-radius:8px}
button{width:100%;background:#2563eb;color:white;padding:12px;border:none;border-radius:8px;margin-top:20px;font-size:16px}
.result{background:#eff6ff;padding:15px;border-radius:8px;margin-top:20px;text-align:center}
a{display:block;text-align:center;margin-top:20px;color:#2563eb}
</style>
</head>
<body>
<div class="container">
<h1>TDEE Calculator</h1>
<p style="text-align:center">Find your daily calorie needs</p>
<label>Gender</label>
<select id="gender"><option value="male">Male</option><option value="female">Female</option></select>
<label>Age (years)</label><input type="number" id="age" value="25">
<label>Height (cm)</label><input type="number" id="height" value="175">
<label>Weight (kg)</label><input type="number" id="weight" value="70">
<label>Activity Level</label>
<select id="activity">
<option value="1.2">Sedentary (little exercise)</option>
<option value="1.375">Lightly Active</option>
<option value="1.55" selected>Moderately Active</option>
<option value="1.725">Very Active</option>
<option value="1.9">Extra Active</option>
</select>
<button onclick="calc()">Calculate TDEE</button>
<div class="result" id="out">Enter details and click Calculate</div>
<a href="index.html">← Back to Home</a>
</div>
<script>
function calc(){
let a=+document.getElementById('age').value;
let h=+document.getElementById('height').value;
let w=+document.getElementById('weight').value;
let g=document.getElementById('gender').value;
let act=+document.getElementById('activity').value;
let bmr = g=='male' ? (10*w+6.25*h-5*a+5) : (10*w+6.25*h-5*a-161);
let tdee = Math.round(bmr*act);
document.getElementById('out').innerHTML = "<b>Your BMR: "+Math.round(bmr)+" calories</b><br><b>Your TDEE: "+tdee+" calories/day</b><br><br>For Weight Loss: "+(tdee-500)+" cal<br>For Maintenance: "+tdee+" cal<br>For Weight Gain: "+(tdee+500)+" cal";
}
</script>
</body>
</html>
